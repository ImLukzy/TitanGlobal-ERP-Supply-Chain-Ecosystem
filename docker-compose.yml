services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: titanglobal
      POSTGRES_USER: titanglobal
      POSTGRES_PASSWORD: titanglobal_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titanglobal -d titanglobal"]
      interval: 5s
      timeout: 5s
      retries: 10
